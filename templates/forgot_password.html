{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h3>Reset your password</h3>
    <p class="text-muted">We will guide you to recover your account.</p>
    <form method="post">
      {{ form.hidden_tag() }}
      <div class="mb-3">{{ form.email(class_='form-control', placeholder='Email address') }}</div>
      <button class="btn btn-primary w-100">{{ form.submit.label.text }}</button>
    </form>
    <p class="mt-3 text-center"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
